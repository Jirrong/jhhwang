# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Jiho Hwang
email: jhhwang16@snu.ac.kr
description: > # this means to ignore newlines until "baseurl:"
  Jiho Hwang, undergraduate student in Chemistry at Seoul National University.
baseurl: "/jhhwang"
url: "https://jirrong.github.io"

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

# Notebook features only. The original template settings above are preserved.
timezone: Asia/Seoul
repository: Jirrong/jhhwang
author:
  name: Jiho Hwang
  email: jhhwang16@snu.ac.kr
github_branch: gh-pages
permalink: /blog/:year/:month/:day/:title/
future: false
show_drafts: false
plugins: [jekyll-feed, jekyll-sitemap]
whitelist: [jekyll-feed, jekyll-sitemap]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - vendor
  - node_modules
  - scripts
  - docs
  - tests
  - .bundle
  - package.json
  - package-lock.json
  - research.md
  - research 2.md
  - .DS_Store
  - _pages/pictures.md
  - downloads
defaults:
  - scope:
      path: ''
      type: posts
    values:
      layout: notebook-post
      author: Jiho Hwang
      lang: en
      math: true
      toc: true
      notebook_class: notebook-article

# The public site and new blog posts default to English.
lang: en

# Same-origin asset used by every CV download link.
cv_pdf: /assets/pdf/Jiho_Hwang_CV.pdf
