<header class="site-header">
  <div class="container-fluid header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Jiho Hwang — Home"><span class="brand-mark" aria-hidden="true">jh<span>.</span></span><span class="brand-name">Jiho Hwang<small>CHEMISTRY · SNU</small></span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" hidden><span aria-hidden="true">☰</span><span>Menu</span></button>
    <nav id="primary-navigation" class="primary-navigation" aria-label="Main navigation">
      {% assign current_url = page.url %}
      <a href="{{ '/' | relative_url }}"{% if current_url == '/' %} aria-current="page"{% endif %}>Overview</a>
      <a href="{{ '/interests/' | relative_url }}"{% if current_url == '/interests/' or current_url == '/publications/' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/blog/' | relative_url }}"{% if current_url contains '/blog/' %} aria-current="page"{% endif %}>Notebook</a>
      <a href="{{ '/cv/' | relative_url }}"{% if current_url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
      <a class="nav-contact" href="mailto:{{ site.email | escape }}">Say hello <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
