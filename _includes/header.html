<div class="navbar navbar-default navbar-fixed-top" role="navigation">
  <div class="container-fluid">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar-collapse-1" aria-expanded="false">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.navbar_title | default: site.title | escape }}</a>
    </div>
    <div class="collapse navbar-collapse" id="navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right">
        <li{% if page.url == '/' %} class="active"{% endif %}><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
        <li{% if page.url == '/cv/' %} class="active"{% endif %}><a href="{{ site.cv_pdf | relative_url }}" target="_blank" rel="noopener" type="application/pdf">CV</a></li>
        <li{% if page.url contains '/research/' or page.url == '/interests/' %} class="active"{% endif %}><a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a></li>
        <li{% if page.url contains '/publications/' %} class="active"{% endif %}><a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a></li>
        <li{% if page.url contains '/resources/' %} class="active"{% endif %}><a href="{{ '/resources/' | relative_url }}"{% if page.url == '/resources/' %} aria-current="page"{% endif %}>Resources</a></li>
        <li{% if page.url contains '/blog/' %} class="active"{% endif %}><a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a></li>
        <li{% if page.url == '/news/' or page.url == '/allnews.html' %} class="active"{% endif %}><a href="{{ '/news/' | relative_url }}"{% if page.url == '/news/' %} aria-current="page"{% endif %}>News</a></li>
      </ul>
    </div>
  </div>
</div>
