<div class="news-archive" markdown="0">
  {% for article in site.data.news %}
  <article class="news-entry">
    <p class="text-muted news-date"><strong>{{ article.date | escape }}</strong></p>
    <div class="news-body">{{ article.headline | markdownify }}</div>
  </article>
  {% else %}
  <p>No news yet.</p>
  {% endfor %}
</div>
