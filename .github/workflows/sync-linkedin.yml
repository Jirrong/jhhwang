name: Sync LinkedIn posts

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: linkedin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check authorized API configuration
        id: config
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
        run: |
          if [ -n "$LINKEDIN_ACCESS_TOKEN" ] && [ -n "$LINKEDIN_AUTHOR_URN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::LinkedIn sync is inactive. Configure your approved read token and author URN as described in docs/linkedin-sync.md.'
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Fetch original posts and images
        if: steps.config.outputs.ready == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202610' }}
        run: python3 scripts/sync_linkedin.py
      - name: Detect imported changes
        id: changes
        if: steps.config.outputs.ready == 'true'
        run: |
          git add -- _posts assets/linkedin
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@v1
        if: steps.changes.outputs.changed == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Validate and build before publication
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check_template.py
          python3 scripts/check_cv_pdf.py
          bundle exec ruby scripts/check_content.rb
          bundle exec ruby scripts/check_records.rb
          bundle exec ruby scripts/check_linkedin_rendering.rb
          bundle exec jekyll build --safe --strict_front_matter --trace
          python3 scripts/check_site.py _site
      - name: Publish imported posts and request a Pages build
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync original LinkedIn posts'
          git push origin HEAD:gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
