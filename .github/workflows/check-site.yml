name: Check academic site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/check_template.py
      - run: python3 scripts/check_cv_pdf.py
      - run: bundle exec ruby scripts/check_content.rb
      - run: bundle exec ruby scripts/check_publication_rendering.rb
      - run: bundle exec ruby scripts/check_records.rb
      - run: bundle exec ruby scripts/check_record_rendering.rb
      - run: bundle exec jekyll build --strict_front_matter --trace
      - run: python3 scripts/check_site.py _site
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
