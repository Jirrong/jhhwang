<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="site-main" tabindex="-1"><div class="container-fluid">{{ content }}</div></main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.blog_index %}<script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>{% endif %}
    {% if page.layout == 'post' %}<script src="{{ '/assets/js/post.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
