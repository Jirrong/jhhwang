---
layout: default
---
<div class="page-shell{% if page.wide %} page-shell-wide{% endif %}">
  {% unless page.hide_heading %}<header class="page-heading"><p class="eyebrow">{{ page.eyebrow | default: 'Academic home' }}</p><h1>{{ page.title }}</h1>{% if page.subtitle %}<p class="page-lead">{{ page.subtitle }}</p>{% endif %}</header>{% endunless %}
  <div class="page-content prose">{{ content }}</div>
</div>
